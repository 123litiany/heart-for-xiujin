<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>宗秀瑾 ❤️</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#12050c;color:#fff9fa;font-family:system-ui,sans-serif}main{min-height:100vh;min-height:100svh;display:grid;place-items:center}form{width:min(84vw,340px);text-align:center}.mark{font-size:64px;color:#ff3155;margin:0 0 20px}h1{font-size:24px;font-weight:500;margin:0 0 36px}label{display:block;text-align:left;font-size:16px;margin-bottom:12px;color:#e6b8c4}input{width:100%;height:52px;padding:12px 16px;border:1px solid #71404f;border-radius:12px;background:#24101a;color:white;font:inherit;font-size:18px}input:focus{outline:2px solid #ff5977}#hint{min-height:22px;font-size:14px;color:#ffa1b4;margin:10px 0}button{width:100%;border:0;border-radius:12px;background:#ed254e;color:white;font:inherit;font-size:17px;padding:15px;cursor:pointer}button:focus-visible{outline:3px solid white;outline-offset:4px}picture{display:block;width:min(100vw,600px,90svh)}img{display:block;width:100%;height:auto}[hidden]{display:none!important}
#heart{position:relative;width:min(100vw,600px,90svh)}#heart picture{width:100%}#heart img{filter:hue-rotate(-22deg) saturate(.64) brightness(1.45);mask-image:radial-gradient(ellipse at center,#000 51%,transparent 73%);-webkit-mask-image:radial-gradient(ellipse at center,#000 51%,transparent 73%)}.sparkle{position:absolute;left:var(--x);top:var(--y);font-size:var(--s);line-height:1;color:#fff5fc;text-shadow:0 0 7px #fff,0 0 15px #ff94d2,0 0 25px #ff58bc;pointer-events:none;animation:twinkle 2.1s ease-in-out infinite;animation-delay:var(--delay)}@keyframes twinkle{0%,100%{opacity:.1;transform:translate(-50%,-50%) scale(.35) rotate(-12deg)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(12deg)}}@media(prefers-reduced-motion:reduce){.sparkle{animation:none;opacity:.8;transform:translate(-50%,-50%)}}</style></head><body><main><form id="gate"><p class="mark" aria-hidden="true">♡</p><h1>有一份心动，等你打开</h1><label for="name">输入你的名字</label><input id="name" autocomplete="off" maxlength="30" aria-describedby="hint"><p id="hint" role="status"></p><button type="submit">打开心意</button></form><div id="heart" hidden><picture><source media="(prefers-reduced-motion:reduce)" srcset="heart-still.png"><img src="heart.gif" width="600" height="600" alt="粉色爱心闪闪发光、轻轻跳动，中间写着宗秀瑾" tabindex="-1"></picture><span class="sparkle" style="--x:22%;--y:29%;--s:26px;--delay:0s" aria-hidden="true">✦</span><span class="sparkle" style="--x:31%;--y:23%;--s:14px;--delay:-0.37s" aria-hidden="true">✦</span><span class="sparkle" style="--x:64%;--y:25%;--s:24px;--delay:-0.74s" aria-hidden="true">✦</span><span class="sparkle" style="--x:76%;--y:36%;--s:32px;--delay:-1.11s" aria-hidden="true">✦</span><span class="sparkle" style="--x:20%;--y:49%;--s:15px;--delay:-1.48s" aria-hidden="true">✦</span><span class="sparkle" style="--x:69%;--y:55%;--s:23px;--delay:-1.85s" aria-hidden="true">✦</span><span class="sparkle" style="--x:47%;--y:67%;--s:18px;--delay:-2.22s" aria-hidden="true">✦</span><span class="sparkle" style="--x:57%;--y:35%;--s:12px;--delay:-2.59s" aria-hidden="true">✦</span><span class="sparkle" style="--x:35%;--y:57%;--s:11px;--delay:-2.96s" aria-hidden="true">✦</span><span class="sparkle" style="--x:83%;--y:57%;--s:17px;--delay:-3.33s" aria-hidden="true">✦</span><span class="sparkle" style="--x:15%;--y:36%;--s:13px;--delay:-3.7s" aria-hidden="true">✦</span><span class="sparkle" style="--x:56%;--y:77%;--s:21px;--delay:-4.07s" aria-hidden="true">✦</span><span class="sparkle" style="--x:42%;--y:31%;--s:9px;--delay:-4.44s" aria-hidden="true">✦</span><span class="sparkle" style="--x:62%;--y:63%;--s:10px;--delay:-4.81s" aria-hidden="true">✦</span></div></main><script>
const gate=document.getElementById('gate'),nameInput=document.getElementById('name'),hint=document.getElementById('hint'),heart=document.getElementById('heart');gate.addEventListener('submit',e=>{e.preventDefault();if(nameInput.value.trim()==='宗秀瑾'){gate.hidden=true;heart.hidden=false;heart.querySelector('img').focus()}else{hint.textContent='名字还不对哦，再试一次。';nameInput.setAttribute('aria-invalid','true')}});nameInput.addEventListener('input',()=>{hint.textContent='';nameInput.removeAttribute('aria-invalid')});
</script></body></html>
